name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: docker.io/bralmeida/smtprelay

jobs:
  build-test:
    name: Validate, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 'stable' rather than pinning '1.23': go.mod's `go 1.23` is only
          # the minimum language version our code needs (a newer toolchain
          # builds it fine, confirmed locally with go1.27) -- but
          # golang.org/x/vuln/cmd/govulncheck (installed below) requires Go
          # 1.26+ to build at all. Pinning too low here broke CI without
          # touching any actual vulnerability.
          go-version: 'stable'

      - name: Validate (go vet)
        run: go vet ./...

      - name: Test (includes the open-relay proof)
        run: go test ./... -v

      - name: Security checks (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Build container image
        run: docker build -t smtprelay:ci .

  push:
    name: Push image to Docker Hub
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy to Azure (Modo A)
    needs: push
    runs-on: ubuntu-latest
    # Disabled by default: requires the AZURE_CLIENT_ID / AZURE_TENANT_ID /
    # AZURE_SUBSCRIPTION_ID repo variables (not secrets -- an OIDC federated
    # credential is what actually authorizes this, not a stored value) plus
    # the AZURE_RESOURCE_GROUP, RELAY_USER, RELAY_PASSWORD, TLS_CERT_PEM and
    # TLS_KEY_PEM secrets. Once they're all configured, replace this with
    # `if: github.event_name == 'push' && github.ref == 'refs/heads/main'`.
    # See docs/operations.md and docs/security.md.
    if: false
    permissions:
      id-token: write # required for OIDC federation with Azure AD
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC, no stored secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep (Modo A)
        run: |
          az deployment group create \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters infra/parameters/economic.parameters.json \
            --parameters containerImage=${{ env.IMAGE }}:${{ github.sha }} \
                         relayUser="${{ secrets.RELAY_USER }}" \
                         relayPassword="${{ secrets.RELAY_PASSWORD }}" \
                         tlsCertPem="${{ secrets.TLS_CERT_PEM }}" \
                         tlsKeyPem="${{ secrets.TLS_KEY_PEM }}"
